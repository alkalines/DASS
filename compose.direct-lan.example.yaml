# Explicit CachyOS two-client test only; never use as a production deployment.
# Run after compose.yaml. Adds LAN HTTPS while retaining loopback HTTPS.
# For media, additionally use compose.lan-spike.example.yaml with fresh peers.
services:
  backend:
    environment:
      DASS_INSECURE_LOCAL_DEV: "false"
      DASS_TLS_CERT_FILE: /run/dass/cert.pem
      DASS_TLS_KEY_FILE: /run/dass/key.pem
      DASS_INVITE_FILE: /run/dass/invites.json
      DASS_RTC_SPIKE: "false"
    ports:
      - "X.X.X.1:8080:8080/tcp"
    volumes:
      - type: bind
        source: ./.secrets/lan-test/cert.pem
        target: /run/dass/cert.pem
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./.secrets/lan-test/key.pem
        target: /run/dass/key.pem
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./.secrets/lan-test/invites.json
        target: /run/dass/invites.json
        read_only: true
        bind:
          create_host_path: false
