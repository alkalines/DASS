[package]
name = "dass-backend"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
# 0.40.x uses cfg_select!, unavailable on the pinned Rust 1.90 toolchain.
rusqlite = { version = "=0.39.0", default-features = false, features = ["bundled"] }
dass-protocol = { path = "../protocol" }
axum.workspace = true
argon2.workspace = true
getrandom.workspace = true
rustls.workspace = true
aws-lc-rs.workspace = true
str0m.workspace = true
str0m-aws-lc-rs.workspace = true
# Constrain the provider's DTLS implementation to the reviewed release.
dimpl.workspace = true
rustls-pki-types.workspace = true
tokio-rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tower.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
rcgen = { version = "=0.14.10", default-features = false, features = ["aws_lc_rs"] }
tokio-tungstenite = { version = "=0.29.0", default-features = false, features = ["connect", "handshake"] }
futures-util = { version = "=0.3.34", default-features = false, features = ["std", "sink"] }
