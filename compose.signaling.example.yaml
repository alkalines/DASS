# Local control-plane testing only; not a deployment or media configuration.
# Supply your own client-trusted TLS material and backend-readable invite file.
services:
  backend:
    environment:
      DASS_INSECURE_LOCAL_DEV: "false"
      DASS_TLS_CERT_FILE: /run/dass/cert.pem
      DASS_TLS_KEY_FILE: /run/dass/key.pem
      DASS_INVITE_FILE: /run/dass/invites.json
    volumes:
      - type: bind
        source: ./.secrets/cert.pem
        target: /run/dass/cert.pem
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./.secrets/key.pem
        target: /run/dass/key.pem
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./.secrets/invites.json
        target: /run/dass/invites.json
        read_only: true
        bind:
          create_host_path: false
