name: Build Docker images

on:
  workflow_dispatch:
    inputs:
      image:
        description: Image to build
        required: true
        default: pterodactyl
        type: choice
        options: [both, runtime, pterodactyl]
      publish:
        description: Publish to GHCR (otherwise download Docker image artifacts)
        required: true
        default: true
        type: boolean
      fast_build:
        description: Fast build (skip formatting, Clippy and tests; development only)
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(inputs.image == 'both' && '["runtime","pterodactyl"]' || format('["{0}"]', inputs.image)) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Name isolated manual-build images
        id: metadata
        env:
          TARGET: ${{ matrix.target }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          version="0.0.0-manual.${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}"
          tag="manual-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          dev_tag="manual-dev"
          if [ "$TARGET" = pterodactyl ]; then
            tag="$tag-pterodactyl"
            dev_tag="$dev_tag-pterodactyl"
          fi
          printf 'tag=%s:%s\nversion=%s\n' "$image" "$tag" "$version" >> "$GITHUB_OUTPUT"
          printf 'dev_tag=%s:%s\n' "$image" "$dev_tag" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        if: inputs.publish
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build image (validation optional)
        id: image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64
          tags: |
            ${{ steps.metadata.outputs.tag }}
            ${{ inputs.publish && steps.metadata.outputs.dev_tag || '' }}
          outputs: ${{ inputs.publish && 'type=registry' || format('type=docker,dest={0}/dass-{1}.tar', runner.temp, matrix.target) }}
          build-args: |
            DASS_RELEASE_VERSION=${{ steps.metadata.outputs.version }}
            DASS_SKIP_CHECKS=${{ inputs.fast_build }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.metadata.outputs.version }}
          provenance: ${{ inputs.publish && 'mode=max' || 'false' }}
          sbom: ${{ inputs.publish }}
          cache-from: type=gha,scope=manual-${{ matrix.target }}
          cache-to: type=gha,scope=manual-${{ matrix.target }},mode=max
      - name: Upload loadable Docker image
        if: ${{ !inputs.publish }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dass-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dass-${{ matrix.target }}.tar
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Record image reference
        env:
          IMAGE: ${{ steps.metadata.outputs.tag }}
          DEV_IMAGE: ${{ steps.metadata.outputs.dev_tag }}
          DIGEST: ${{ steps.image.outputs.digest }}
          TARGET: ${{ matrix.target }}
          PUBLISH: ${{ inputs.publish }}
          FAST_BUILD: ${{ inputs.fast_build }}
        run: |
          {
            printf '### %s (linux/amd64)\n\n' "$TARGET"
            if [ "$FAST_BUILD" = true ]; then
              printf '**Fast build: formatting, Clippy and tests skipped. Development use only.**\n\n'
            fi
            printf 'Image: `%s`\n\nSource: `%s`\n\n' "$IMAGE" "$GITHUB_SHA"
            if [ "$PUBLISH" = true ]; then
              printf 'Published digest: `%s`\n\nPull: `docker pull %s`\n' "$DIGEST" "$IMAGE"
              printf '\nDevelopment alias: `%s`\n\nPull: `docker pull %s`\n' "$DEV_IMAGE" "$DEV_IMAGE"
            else
              printf 'Download and extract the image artifact, then run: `docker load --input dass-%s.tar`\n' "$TARGET"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
