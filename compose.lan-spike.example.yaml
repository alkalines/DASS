# Explicit two-client LAN feasibility test only; not a production deployment.
# Use after compose.signaling.example.yaml. TCP remains loopback-published.
# Prepare TLS/invites first. Use fresh exact endpoints, or explicitly trust the
# clients' fixed IPv4 addresses to accommodate Chromium's changing UDP ports.
# Never commit credentials or use old gathered ports.
services:
  backend:
    environment:
      DASS_RTC_SPIKE: "true"
      DASS_RTC_BIND_IP: "0.0.0.0"
      DASS_RTC_ADVERTISED_IP: "X.X.X.1"
      DASS_RTC_FIRST_PORT: "50000"
      DASS_RTC_ALLOWED_PEERS: "${DASS_TEST_ALLOWED_PEERS:-}"
      DASS_RTC_TRUSTED_CLIENT_IPS: "${DASS_TEST_TRUSTED_CLIENT_IPS:-}"
    ports:
      - "X.X.X.1:50000:50000/udp"
      - "X.X.X.1:50001:50001/udp"
