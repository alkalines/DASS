services:
  backend:
    # if you don't want to clone the repo just use image: ghcr.io/alkalines/dass:latest
    build:
      context: .
      target: runtime
    # Compose >= 2.30: raw preserves Argon2 '$' in DASS_USERS/DASS_ADMIN_USERS.
    # Legacy administrator import: DASS_ADMIN_USERS=USER1:ARGON2HASH;USER2:ARGON2HASH
    # New account-mode databases default to admin/admin, with mandatory password
    # change before other panel access. Keep setup private until changed.
    # Put this in the raw private env file below, NOT interpolated .env.
    # Optional so the default loopback discovery scaffold needs no secrets.
    env_file:
      - path: ./.secrets/backend.env
        required: false
        format: raw
    environment:
      DASS_INSECURE_LOCAL_DEV: "${DASS_INSECURE_LOCAL_DEV:-true}"
      DASS_LISTEN_ADDR: "0.0.0.0:8080"
      # Bootstrap inputs only: after the first successful migration, edit these
      # in /admin/settings. Existing SQLite values always win over the env.
      DASS_DATABASE_FILE: "/var/lib/dass/dass.sqlite3"
      DASS_MAX_CONCURRENT_REQUESTS: "${DASS_MAX_CONCURRENT_REQUESTS:-128}"
      DASS_MAX_CONTROL_MESSAGE_BYTES: "${DASS_MAX_CONTROL_MESSAGE_BYTES:-16384}"
      DASS_MAX_SESSIONS: "${DASS_MAX_SESSIONS:-128}"
      DASS_MAX_UNAUTHENTICATED_SESSIONS: "${DASS_MAX_UNAUTHENTICATED_SESSIONS:-0}"
      DASS_MAX_TCP_CONNECTIONS: "${DASS_MAX_TCP_CONNECTIONS:-128}"
      DASS_MAX_PASSWORD_VERIFICATIONS: "${DASS_MAX_PASSWORD_VERIFICATIONS:-2}"
      DASS_ADMIN_DATA_FILE: "/var/lib/dass/policy.json"
      # Transport mode: "local" is the LAN test environment, "public" is the
      # Internet target. "public" requires TLS and a globally routable
      # advertised media address.
      DASS_TRANSPORT_MODE: "${DASS_TRANSPORT_MODE:-local}"
      DASS_RTC_SPIKE: "${DASS_RTC_SPIKE:-false}"
      DASS_RTC_BIND_IP: "0.0.0.0"
      DASS_RTC_ADVERTISED_IP: "${DASS_LAN_SERVER_IPV4:-127.0.0.1}"
      DASS_RTC_FIRST_PORT: "50000"
      DASS_RTC_AUTO_LAN_PEERS: "${DASS_RTC_AUTO_LAN_PEERS:-false}"
      DASS_RTC_ALLOWED_PEERS: "${DASS_RTC_ALLOWED_PEERS:-}"
      DASS_RTC_TRUSTED_CLIENT_IPS: "${DASS_RTC_TRUSTED_CLIENT_IPS:-}"
      DASS_MAX_MEDIA_SESSIONS: "${DASS_MAX_MEDIA_SESSIONS:-2}"
      DASS_MAX_PACKETS_PER_SECOND: "${DASS_MAX_PACKETS_PER_SECOND:-2000}"
      DASS_MAX_INGRESS_BYTES_PER_SECOND: "${DASS_MAX_INGRESS_BYTES_PER_SECOND:-2000000}"
      DASS_MAX_EGRESS_BYTES_PER_SECOND: "${DASS_MAX_EGRESS_BYTES_PER_SECOND:-4000000}"
    ports:
      # Never change DASS_BIND_IP from loopback while insecure mode is enabled.
      - "${DASS_BIND_IP:-127.0.0.1}:8080:8080/tcp"
      - "${DASS_BIND_IP:-127.0.0.1}:50000:50000/udp"
      - "${DASS_BIND_IP:-127.0.0.1}:50001:50001/udp"
    volumes:
      # Only runtime TLS/invite files belong here, never password source files.
      - ./.secrets/runtime:/run/dass:ro
      # Writable SQLite database/journal and legacy import; root stays read-only.
      - backend-data:/var/lib/dass
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    mem_limit: 256m
    cpus: 1.0
    stop_grace_period: 10s

volumes:
  backend-data:
